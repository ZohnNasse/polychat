<!-- WebSocket 송수신 + 모델별/전역 설정 편집 UI -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolyChat</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    #log { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; min-height: 300px; max-height: 60vh; overflow-y: auto; background: #fafafa; }
    .row { margin: 0.75rem 0; }
    /* 한 번의 전송 = 한 턴. 내 메시지 + 모델별 응답 카드 묶음. */
    .turn { margin: 0 0 1.25rem; }
    .user-msg { font-weight: 600; white-space: pre-wrap; margin-bottom: 0.5rem; }
    .user-msg::before { content: "나 "; color: #888; font-weight: 400; }
    .cards-row { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .resp-card { flex: 1 1 260px; min-width: 240px; border: 1px solid #e2e2e2; border-left: 4px solid #888;
                 border-radius: 6px; padding: 0.5rem 0.75rem; background: #fff; }
    .resp-head { font-weight: 600; font-size: 0.85rem; margin-bottom: 0.35rem; }
    .resp-body { white-space: pre-wrap; font-size: 0.9rem; line-height: 1.45; }
    .resp-body:empty::after { content: "응답 대기 중..."; color: #aaa; }
    .resp-card.error { border-left-color: #dc2626; }
    .resp-card.error .resp-body { color: #dc2626; }
    input[type=text] { width: 70%; padding: 0.5rem; }
    button { padding: 0.5rem 0.9rem; cursor: pointer; }
    details { border: 1px solid #ddd; border-radius: 8px; padding: 0.5rem 0.9rem; margin: 0.75rem 0; }
    summary { cursor: pointer; font-weight: 600; }
    .card { border-left: 4px solid #888; padding: 0.5rem 0.75rem; margin: 0.6rem 0; background: #fafafa; border-radius: 6px; }
    .card .head { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; }
    .card textarea { width: 100%; box-sizing: border-box; margin-top: 0.4rem; min-height: 48px; font-family: inherit; }
    #globalNote { width: 100%; box-sizing: border-box; min-height: 60px; font-family: inherit; }
  </style>
</head>
<body>
  <h1>PolyChat</h1>
  <div class="row">상태: <span id="conn">연결 중...</span> <button id="statusBtn">status 요청</button></div>
  <div class="row">
    Claude:
    <button id="loginBtn">로그인 창 열기</button>
    <button id="loginDoneBtn">로그인 완료(세션 저장)</button>
  </div>

  <details id="settings" open>
    <summary>설정</summary>
    <div class="row">
      <label for="globalNote">전역 메모리 노트 (모든 모델 공통)</label>
      <textarea id="globalNote" placeholder="모든 모델에 공통으로 주입할 메모(예: 한국어로 간결하게)..."></textarea>
    </div>
    <div id="cards"></div>
    <div class="row"><button id="saveBtn">설정 저장</button> <span id="saveMsg"></span></div>
  </details>

  <div id="log"></div>
  <div class="row">
    <input type="text" id="input" placeholder="메시지 입력...">
    <button id="sendBtn">전송</button>
  </div>

  <script>
    const log = document.getElementById("log");
    const conn = document.getElementById("conn");
    const cards = document.getElementById("cards");
    const globalNote = document.getElementById("globalNote");
    const saveMsg = document.getElementById("saveMsg");
    let agents = [];  // 서버 settings로 채워진다.

    let currentRow = null;        // 현재 턴의 카드들이 들어갈 행
    const cardBodies = {};        // turn_id -> 응답 본문 element

    const agentMeta = (id) =>
      agents.find(a => a.id === id) || { display_name: id, color: "#888" };

    // chunk/done/error가 오면 해당 턴·모델 카드를 찾거나 만들어 본문 element를 돌려준다.
    const ensureCard = (msg) => {
      const key = msg.turn_id || msg.agent;
      if (cardBodies[key]) return cardBodies[key];
      const meta = agentMeta(msg.agent);
      const card = document.createElement("div");
      card.className = "resp-card";
      card.style.borderLeftColor = meta.color || "#888";
      const head = document.createElement("div");
      head.className = "resp-head";
      head.textContent = meta.display_name;
      const body = document.createElement("div");
      body.className = "resp-body";
      card.appendChild(head);
      card.appendChild(body);
      (currentRow || log).appendChild(card);
      cardBodies[key] = body;
      log.scrollTop = log.scrollHeight;
      return body;
    };

    const renderCards = () => {
      cards.innerHTML = "";
      for (const a of agents) {
        const card = document.createElement("div");
        card.className = "card";
        card.style.borderLeftColor = a.color || "#888";
        card.innerHTML = `
          <div class="head">
            <input type="checkbox" data-id="${a.id}" class="enabled" ${a.enabled ? "checked" : ""}>
            <span>${a.display_name}</span>
          </div>
          <textarea data-id="${a.id}" class="role" placeholder="역할 프롬프트 (첫 대화에 1회 주입)">${a.role_prompt || ""}</textarea>
        `;
        cards.appendChild(card);
      }
    };

    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => {
      conn.textContent = "연결됨";
      ws.send(JSON.stringify({ type: "status" }));
      ws.send(JSON.stringify({ type: "get_settings" }));
    };
    ws.onclose = () => { conn.textContent = "연결 끊김"; };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === "settings") {
        agents = msg.agents;
        globalNote.value = msg.global_note || "";
        renderCards();
        saveMsg.textContent = "불러옴";
        return;
      }
      if (msg.type === "chunk" || msg.type === "done") {
        const body = ensureCard(msg);
        if (typeof msg.text === "string" && msg.text) body.textContent = msg.text;
        return;
      }
      if (msg.type === "error") {
        const body = ensureCard(msg);
        body.parentElement.classList.add("error");
        body.textContent = "⚠ " + (msg.message || "오류");
        return;
      }
      // status 등 그 외 메시지는 화면에 띄우지 않는다.
    };

    document.getElementById("statusBtn").onclick = () =>
      ws.send(JSON.stringify({ type: "status" }));
    document.getElementById("loginBtn").onclick = () =>
      ws.send(JSON.stringify({ type: "login", agent: "claude" }));
    document.getElementById("loginDoneBtn").onclick = () =>
      ws.send(JSON.stringify({ type: "login_complete", agent: "claude" }));

    document.getElementById("saveBtn").onclick = () => {
      const payload = { type: "save_settings", global_note: globalNote.value, agents: {} };
      document.querySelectorAll(".role").forEach(t => {
        payload.agents[t.dataset.id] = { role_prompt: t.value };
      });
      document.querySelectorAll(".enabled").forEach(c => {
        payload.agents[c.dataset.id].enabled = c.checked;
      });
      ws.send(JSON.stringify(payload));
      saveMsg.textContent = "저장됨";
    };

    const input = document.getElementById("input");
    const send = () => {
      const text = input.value.trim();
      if (!text) return;
      const target = [...document.querySelectorAll(".enabled:checked")].map(c => c.dataset.id);
      if (!target.length) return;
      ws.send(JSON.stringify({ type: "send", target, text }));

      // 이번 턴 블록 생성: 내 메시지 + 대상 모델 카드가 들어갈 빈 행.
      const turn = document.createElement("div");
      turn.className = "turn";
      const u = document.createElement("div");
      u.className = "user-msg";
      u.textContent = text;
      const cardsRow = document.createElement("div");
      cardsRow.className = "cards-row";
      turn.appendChild(u);
      turn.appendChild(cardsRow);
      log.appendChild(turn);
      currentRow = cardsRow;
      log.scrollTop = log.scrollHeight;
      input.value = "";
    };
    document.getElementById("sendBtn").onclick = send;
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); send(); }
    });
  </script>
</body>
</html>
